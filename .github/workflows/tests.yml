name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # The host core lib is checked out below and the ffmpeg package is
      # installed below, so the essential conversion/mixdown regressions must
      # run — never silently skip for lack of a capability. tests/conftest.py
      # aborts the session with a clear message if any required capability is
      # missing, so a broken provisioning step fails CI loudly instead of
      # turning into a green run full of skips.
      FEEDPAKR_REQUIRE: host,ffmpeg
    steps:
      - name: Check out feedpakr
        uses: actions/checkout@v4
        with:
          path: feedBack-plugin-feedpakr
          persist-credentials: false
      - name: Check out feedBack host libraries
        uses: actions/checkout@v4
        with:
          repository: get-flashbacks/feedBack
          path: pakr/feedBack
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            feedBack-plugin-feedpakr/requirements-test.txt
            feedBack-plugin-feedpakr/requirements.txt
            pakr/feedBack/requirements.txt
      - name: Install test dependencies
        run: >-
          python -m pip install
          -r feedBack-plugin-feedpakr/requirements-test.txt
          -r feedBack-plugin-feedpakr/requirements.txt
          -r pakr/feedBack/requirements.txt
      - name: Install ffmpeg
        # Drives the real mixdown/transcode/auto-sync regressions in
        # test_audio.py and test_upgrade.py. Provides ffprobe too, which
        # feedpakr_audio.get_audio_duration shells out to.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run tests
        working-directory: feedBack-plugin-feedpakr
        # -ra (also set in pytest.ini) prints the short test summary so every
        # skip reason is visible in the CI log.
        run: python -m pytest -q -ra
