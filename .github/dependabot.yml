version: 2
updates:
  # Keep GitHub Actions up to date, including SHA-pinned actions like
  # pullfrog/pullfrog@<sha> — Dependabot resolves the SHA to the tag it
  # corresponds to and opens a PR bumping to the new release's SHA,
  # keeping the pin fresh without giving up commit-pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Patch/minor updates can open PRs; major version bumps
    # (which can change an action's inputs/outputs) still need a human
    # to review and update the workflow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group eligible version updates after the major-version ignore above.
    # Security updates remain separate. This does not enable auto-merge.
    groups:
      version-updates:
        patterns: ["*"]

  # Python dependencies declared in requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Keep range-only Python updates as individual PRs for review.
    # The semver-major ignore above excludes nothing here: a range-style
    # requirement with no lockfile has no resolved current version, so
    # the rule is evaluated, logged, and matches nothing — a
    # deterministic no-op, not a flaky one. Tracked upstream as
    # dependabot/dependabot-core#10573; the fix (#13516) is closed
    # unmerged. Only the open-ended defusedxml>=0.7.1 is exposed —
    # jsonschema's "<5" ceiling blocks a 5.x proposal on its own under
    # increase-if-necessary. If that fix lands, or a lockfile is added,
    # the ignore starts holding and pip updates can be grouped again.
