version: 2
updates:
  # Keep GitHub Actions up to date, including SHA-pinned actions like
  # pullfrog/pullfrog@<sha> — Dependabot resolves the SHA to the tag it
  # corresponds to and opens a PR bumping to the new release's SHA,
  # keeping the pin fresh without giving up commit-pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Patch/minor updates can open PRs; major version bumps
    # (which can change an action's inputs/outputs) still need a human
    # to review and update the workflow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group eligible version updates after the major-version ignore above.
    # Security updates remain separate. This does not enable auto-merge.
    groups:
      version-updates:
        patterns: ["*"]

  # Python dependencies declared in requirements*.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Keep range-only Python updates as individual PRs for review.
    # The semver-major ignore above matches nothing for pytest>=9.1,<10 or
    # jsonschema>=4.20,<5: a range-style requirement with no lockfile has no
    # resolved version, and neither string carries a \d+\.\d+\.\d+ for the
    # machinery to synthesize one from — a deterministic no-op, not a flaky
    # one. What blocks a major for those two is the upper bound itself, under
    # increase-if-necessary. defusedxml>=0.7.1 is the exception: its inline
    # 0.7.1 yields a synthetic version, so the ignore emits >= 1.a for it and
    # 1.x stays hidden. An `==` pin would behave the same way, so none of
    # these manifests use one. Tracked upstream as
    # dependabot/dependabot-core#10573; the fix (#13516) is closed unmerged.
    # If that fix lands, or a lockfile is added, the ignore starts holding and
    # pip updates can be grouped again.
